# Hanzo KMS - Key Management Service
# Default values

replicaCount: 3

image:
  repository: ghcr.io/hanzoai/kms
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podSecurityContext:
  fsGroup: 1000

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: kms.hanzo.ai
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: hanzo-kms-tls
      hosts:
        - kms.hanzo.ai

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

nodeSelector: {}
tolerations: []
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - hanzo-kms
          topologyKey: kubernetes.io/hostname

# KMS-specific configuration
config:
  # Master key (MUST be provided)
  masterKey: ""

  # Key rotation settings
  keyRotation:
    enabled: true
    intervalDays: 90

  # Audit logging
  audit:
    enabled: true
    retention: 90  # days

  # HSM integration (optional)
  hsm:
    enabled: false
    type: ""  # pkcs11, cloudkms, awskms
    config: {}

# Vault integration (optional)
vault:
  enabled: false
  server:
    ha:
      enabled: true
      replicas: 3
  injector:
    enabled: false

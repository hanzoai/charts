apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: {{ .Release.Name }}
  ports:
    - name: web
      port: {{ .Values.service.ports.web }}
      targetPort: web
    - name: websecure
      port: {{ .Values.service.ports.websecure }}
      targetPort: websecure

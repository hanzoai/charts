# Hanzo Agents - AI Agent Orchestration
# Default values

replicaCount: 2

image:
  repository: ghcr.io/hanzoai/agents
  pullPolicy: IfNotPresent
  tag: ""

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: agents.hanzo.ai
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: hanzo-agents-tls
      hosts:
        - agents.hanzo.ai

resources:
  limits:
    cpu: 1000m
    memory: 2Gi
  requests:
    cpu: 200m
    memory: 512Mi

# Agents-specific configuration
config:
  # LLM providers
  llm:
    provider: anthropic  # anthropic, openai, local
    model: claude-sonnet-4-20250514
    apiKey: ""

  # MCP servers
  mcp:
    enabled: true
    servers: []

  # Tool execution
  tools:
    sandbox: true
    timeout: 30s

postgresql:
  enabled: true
  auth:
    username: hanzo
    database: hanzo_agents

redis:
  enabled: true

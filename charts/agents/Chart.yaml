apiVersion: v2
name: hanzo-agents
description: Hanzo Agents - AI agent orchestration and execution
type: application
version: 0.1.0
appVersion: "1.0.0"
kubeVersion: ">=1.25.0"
home: https://hanzo.ai
icon: https://hanzo.ai/icon.png
sources:
  - https://github.com/hanzoai/agents
maintainers:
  - name: Hanzo AI
    email: ops@hanzo.ai
    url: https://hanzo.ai
keywords:
  - hanzo
  - agents
  - ai
  - orchestration
  - mcp
dependencies:
  - name: redis
    version: ">=17.0.0"
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
  - name: postgresql
    version: ">=12.0.0"
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled

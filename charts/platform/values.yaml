# Hanzo Platform - Developer Platform
# Default values

replicaCount: 1

image:
  repository: ghcr.io/hanzoai/platform
  pullPolicy: IfNotPresent
  tag: ""

service:
  type: ClusterIP
  port: 3000

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: dev.hanzo.ai
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: hanzo-platform-tls
      hosts:
        - dev.hanzo.ai

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Platform-specific configuration
config:
  # Docker socket access (for local dev)
  docker:
    socketPath: /var/run/docker.sock

  # Registry
  registry:
    enabled: true
    url: ""

postgresql:
  enabled: true
  auth:
    username: hanzo
    database: hanzo_platform

redis:
  enabled: true

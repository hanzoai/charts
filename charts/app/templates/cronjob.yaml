{{- range .Values.cronJobs }}
{{- $cj := . }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "app.name" $ }}-{{ $cj.name }}
  labels:
    {{- include "app.labels" $ | nindent 4 }}
spec:
  schedule: {{ $cj.schedule | quote }}
  {{- /* A suspended CronJob is indistinguishable from a healthy one until you
         look, which is how lux-mainnet's hourly C-Chain export sat off for 55
         days and took the recovery archive with it. State it explicitly in
         values so suspending is a reviewable diff, not an invisible kubectl. */}}
  suspend: {{ $cj.suspend | default false }}
  concurrencyPolicy: {{ $cj.concurrencyPolicy | default "Forbid" }}
  successfulJobsHistoryLimit: {{ $cj.successfulJobsHistoryLimit | default 3 }}
  failedJobsHistoryLimit: {{ $cj.failedJobsHistoryLimit | default 3 }}
  {{- with $cj.startingDeadlineSeconds }}
  startingDeadlineSeconds: {{ . }}
  {{- end }}
  jobTemplate:
    spec:
      {{- with $cj.backoffLimit }}
      backoffLimit: {{ . }}
      {{- end }}
      {{- with $cj.activeDeadlineSeconds }}
      activeDeadlineSeconds: {{ . }}
      {{- end }}
      template:
        metadata:
          labels:
            {{- include "app.selectorLabels" $ | nindent 12 }}
            cronjob: {{ $cj.name }}
        spec:
          restartPolicy: {{ $cj.restartPolicy | default "Never" }}
          {{- /* Same pull secrets as the workload. Omitting these made the
                 lux-mainnet export job ImagePullBackOff on a private
                 first-party image while the app beside it pulled fine. */}}
          {{- with $.Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $cj.serviceAccountName }}
          serviceAccountName: {{ . }}
          {{- end }}
          {{- with $cj.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $cj.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
            {{- /* Same inheritance rule as initContainers: a container that
                   omits `image` runs the app's own build, so a sidecar cannot
                   drift from the thing it operates on. */}}
            {{- range $cj.containers }}
            {{- $c := . }}
            {{- if not $c.image }}
            {{- $c = merge (deepCopy $c) (dict "image" (include "app.image" $) "imagePullPolicy" $.Values.image.pullPolicy) }}
            {{- end }}
            - {{- toYaml $c | nindent 14 }}
            {{- end }}
          {{- with $cj.volumes }}
          volumes:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}

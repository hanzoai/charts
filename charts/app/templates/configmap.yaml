{{/*
Standalone ConfigMaps.

A service whose configuration lives in a ConfigMap could not be fully chart-native
before this template existed, and that is not a cosmetic gap — it is what kept
eight services in the raw-manifest plane. `volumes`/`volumeMounts` let the chart
MOUNT a ConfigMap it does not own, so migrating such a service moved its Deployment
and Service to the chart and left the ConfigMap behind in infra/k8s. The workload
and the file it cannot start without would then be owned by two different planes,
which is precisely the split this chart exists to remove: grafana,
hanzo-chain-exporter, ingress, livekit and s3 all mount a ConfigMap they also
define.

`configMaps` and `env`/`envFrom` are not two ways to say one thing. Use `env` for
scalars the container reads at startup. Use this when the unit of configuration is
a FILE — a scrape config, a dashboard, a rules file, a script — because a file has
to be mounted, and mounting requires an object with a name.

NOT for secrets. A ConfigMap is readable by anything with get on the namespace and
its contents land in `helm get values`. Credentials go through `kmsSecrets`, which
names a path in KMS and carries no material; there is deliberately no escape hatch
here either — `additionalProperties: false` rejects `stringData` outright.

⚠️ A ConfigMap change does NOT restart the pods that mount it. A file mount is
updated in place on a kubelet resync (tens of seconds, and never for a subPath
mount), so a process that read the file once at boot keeps the old content
indefinitely. If the consumer cannot reload, roll the workload — set a
`podAnnotations` checksum over the content so the pod template changes with it.
*/}}
{{- range .Values.configMaps }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ required "configMaps[].name is required" .name }}
  labels:
    {{- include "app.labels" $ | nindent 4 }}
    {{- with .labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- with .immutable }}
immutable: {{ . }}
{{- end }}
{{- with .data }}
data:
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- with .binaryData }}
binaryData:
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- end }}

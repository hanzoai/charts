{{/*
Secrets are REFERENCES, never values.

This is the one place a chart is allowed to talk about credentials, and it does
so by naming a path in KMS — never by carrying material. That is what makes a
values.yaml safe to commit, safe to publish on oss.hanzo.ai, and safe to fork:
the fork inherits the shape of the secret and none of its contents.

There is deliberately no `stringData` escape hatch in this chart. If you need a
secret, put it in KMS and reference it here.

WHERE it goes is not a choice — see HIP-0136. The path names the app that READS
the secret, and the key is the environment variable verbatim:

    hanzo/iam/IAM_SERVICE_TOKEN@prod   →   secretsPath /iam
                                           keys        [IAM_SERVICE_TOKEN]
                                           secretName  iam-env

Never the secret's own name (`/iam-service-token`), a purpose (`/cloud-sign`) or
a category (`/integrations/cloudflare`). Those are the three shapes this fleet
grew before the rule existed, and a path you must remember is one you can get
wrong: a service crash-looped for 18 hours next to a key that was present the
whole time.
*/}}
{{- range .Values.kmsSecrets }}
---
{{- /* kms.<universe>, never a brand: kms.hanzo.ai here, kms.lux.cloud on a lux
       install. The old secrets.lux.network named one deployment's brand for
       every tenant of it. */}}
apiVersion: kms.hanzo.ai/v1
kind: KMSSecret
metadata:
  name: {{ .name }}
  labels:
    {{- include "app.labels" $ | nindent 4 }}
    app.kubernetes.io/component: secrets
    {{- with .labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  transport: {{ .transport | default $.Values.kms.transport }}
  zapAddr: {{ .zapAddr | default $.Values.kms.zapAddr }}
  resyncInterval: {{ .resyncInterval | default $.Values.kms.resyncInterval }}
  projectSlug: {{ .projectSlug | default $.Values.kms.projectSlug }}
  envSlug: {{ .envSlug | default $.Values.kms.envSlug }}
  secretsPath: {{ .secretsPath }}
  {{- /* `keys` NAMES the values to pull. Omitting it pulls the whole path —
         which is a different intent, not a shorthand, and the one service
         using it (base) reads a path whose key set is not fixed. An empty
         list is not the same request as no list, so the field is absent
         rather than empty when nothing is named. */}}
  {{- with .keys }}
  keys:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  managedSecretName: {{ .secretName | default .name }}
  {{- /* The release's namespace unless the secret is deliberately PROJECTED
         into another one — for a namespace isolated on purpose, holding no KMS
         identity of its own. Requires Orphan: an owner reference cannot cross a
         namespace, and the projector refuses ownership across one whatever the
         CR asks. */}}
  secretNamespace: {{ .secretNamespace | default $.Release.Namespace }}
  {{- /* Opaque unless the kubelet has to read it. A pull secret must be
         dockerconfigjson: the kubelet type-checks it and SKIPS an Opaque one
         without logging a word, which reads back as a bad credential when in
         fact the credential was never consulted. */}}
  secretType: {{ .secretType | default "Opaque" }}
  {{- /* Orphan by default: deleting the reference must not yank env out from
         under a running pod. `Owner` is the opposite choice and is correct only
         where the consumer re-reads on restart. */}}
  creationPolicy: {{ .creationPolicy | default "Orphan" }}
  {{- /* Rename on the way out: Secret key <- KMS key, for where KMS names a
         value one thing and the consumer reads another. */}}
  {{- with .rename }}
  rename:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- /* Constants written beside the fetched values — not secret, with nowhere
         else to live. */}}
  {{- with .literals }}
  literals:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- /* The identity this CR must read as. The projector REFUSES a CR that sets
         it: the ZAP path authenticates as a peer carrying no principal, so
         serving it would return whichever org the operator resolves to. Declared
         so the requirement is visible and the refusal is legible. */}}
  {{- with .credentialsSecret }}
  credentialsRef: {{ . }}
  {{- end }}
{{- end }}

{{- if .Values.e2e.enabled }}
{{- /* The deploy gate. A PreSync hook boots the CANDIDATE image (the exact
       image:tag this sync wants to roll out) beside a real browser, drives the
       routes, and fails the sync if the app throws. CD applies nothing on a
       failed hook, so the running version keeps serving.

       This exists because a release once shipped on a green SERVER build while
       every page died CLIENT-side in the app's error boundary — an HTML-bytes
       check cannot see a hydration crash. Only a browser can.

       WHICH APPS CAN TURN THIS ON. The candidate sidecar inherits `.Values.env`
       and `.Values.envFrom` and NOTHING ELSE — no volumes. So an app qualifies
       only if it serves its routes from env alone. One that mounts a config
       file (chat reads `CONFIG_PATH=/app/chat.yaml` from a ConfigMap) boots
       into its fallback and tests the wrong thing; one on a ReadWriteOnce claim
       (chat's SQLite PVC) cannot mount it at all while the live pod holds it,
       so the gate would hang rather than fail. Mounting the volumes here is the
       work that would let those apps in — until then, enabling `e2e` for them
       turns a deploy gate into a deploy block. */}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "app.name" . }}-e2e-gate
  annotations:
    deploy.hanzo.ai/hook: PreSync
    deploy.hanzo.ai/hook-delete-policy: BeforeHookCreation
    cd.hanzo.ai/hook: PreSync
    cd.hanzo.ai/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
data:
  smoke.mjs: |
    // Generic app smoke: every route must load in a real browser with no
    // uncaught exception and no error-boundary fallback, at phone and desktop
    // widths. Console errors are reported but only a thrown error or the
    // boundary text fails the gate — third-party console noise must not block
    // a deploy, an app that cannot render must.
    import { chromium } from 'playwright-core'
    const base = process.env.GATE_TARGET
    const routes = JSON.parse(process.env.GATE_ROUTES)
    const boundary = process.env.GATE_BOUNDARY_TEXT
    const deadline = Date.now() + 150000
    for (;;) {
      try { const r = await fetch(base + '/'); if (r.status < 500) break } catch {}
      if (Date.now() > deadline) { console.error('GATE: candidate never became reachable'); process.exit(1) }
      await new Promise(r => setTimeout(r, 2000))
    }
    const browser = await chromium.launch()
    let failed = 0
    // `hasTouch` on the narrow pass, and it is not decoration. Playwright drives
    // the pointer media features from it: with it, `(pointer: coarse)` is true
    // and `(hover: hover)` is false; a bare 390px viewport leaves BOTH at their
    // desktop values. So without it the phone pass silently exercises the
    // desktop branch of every `@media (pointer: coarse)` rule — measured, and it
    // is how three landing CTAs stayed at 20px while a "phone" gate stayed green.
    for (const { width, height, touch } of [
      { width: 390, height: 844, touch: true },
      { width: 1440, height: 900, touch: false },
    ]) {
      const vp = { width, height }
      const ctx = await browser.newContext({ viewport: vp, hasTouch: touch })
      const page = await ctx.newPage()
      for (const route of routes) {
        const errs = []
        const listeners = {
          pageerror: e => errs.push('pageerror: ' + e.message.split('\n')[0].slice(0, 200)),
          console: m => { if (m.type() === 'error') errs.push('console: ' + m.text().split('\n')[0].slice(0, 200)) },
        }
        page.on('pageerror', listeners.pageerror)
        page.on('console', listeners.console)
        let status = 0, boundaryHits = 0
        try {
          const resp = await page.goto(base + route, { waitUntil: 'load', timeout: 45000 })
          status = resp ? resp.status() : 0
          await page.waitForTimeout(4000)
          boundaryHits = await page.locator('text=' + boundary).count()
        } catch (e) {
          errs.push('nav: ' + e.message.split('\n')[0].slice(0, 200))
        }
        page.off('pageerror', listeners.pageerror)
        page.off('console', listeners.console)
        // Sideways scroll on a phone. Nothing else here can see it: the page
        // renders, throws nothing and answers 200 while the reader drags the
        // whole document left to finish a sentence. It is the most common
        // mobile regression there is and the cheapest to catch.
        //
        // Document level only, and only at phone width. An inner carousel
        // scrolling horizontally is a design (the landing page has one) — what
        // is never a design is the DOCUMENT being wider than the screen.
        // Desktop is exempt because a wide table in a scroll box is ordinary
        // there, and a false failure that blocks a deploy teaches people to
        // ignore the gate.
        let overflow = null
        if (vp.width <= 480 && status && status < 400) {
          overflow = await page.evaluate((vw) => {
            const d = document.documentElement
            if (d.scrollWidth <= vw + 1) return null
            // An element inside a scroll/hidden box cannot widen the DOCUMENT,
            // so it is never the culprit. Without this the widest-right search
            // finds the off-canvas decorative layers every design has — measured
            // on this landing page, it named a div at right=6104 while the real
            // offender sat at 900. A gate that points at an innocent element is
            // worse than one that stays quiet.
            const clipped = (el) => {
              for (let p = el.parentElement; p && p !== document.body; p = p.parentElement) {
                const ox = getComputedStyle(p).overflowX
                if (ox === 'hidden' || ox === 'clip' || ox === 'auto' || ox === 'scroll') return true
              }
              return false
            }
            const worst = [...document.querySelectorAll('body *')]
              .map(el => ({ el, r: el.getBoundingClientRect() }))
              .filter(({ el, r }) => r.right > vw + 1 && r.width > 0 && getComputedStyle(el).position !== 'fixed' && !clipped(el))
              .sort((a, b) => b.r.right - a.r.right)[0]
            return {
              scrollW: d.scrollWidth,
              culprit: worst ? `<${worst.el.tagName.toLowerCase()} class="${(worst.el.className + '').slice(0, 60)}"> right=${Math.round(worst.r.right)}` : 'unknown',
            }
          }, vp.width)
        }
        // A control a thumb cannot hit. Only where the pointer is coarse, only
        // for controls the user can SEE — an element inside a `display:none`
        // subtree measures 0x0 and is not a defect — and never for a link that
        // is a word inside a sentence, which is prose, not a target.
        //
        // A target is a BOX, so the floor is the SMALLER side. This read height
        // alone and so passed a 28x44 icon button — the exact shape a phone
        // misses, since a thumb is about as wide as it is tall. The composer's
        // mic was 28 wide for as long as the check existed, and a sweep of six
        // routes reported zero failures while it sat there.
        //
        // And it measures what a thumb can HIT, which is not what the eye sees.
        // @hanzo/ui gives a control its floor WITHOUT touching layout: a
        // transparent `::after` pulled outward on negative insets, so the box
        // stays 32px and the target is 44. Reading `getBoundingClientRect`
        // alone called five correct controls defects and refused every sync of
        // hanzo.app until someone measured the pseudo-element by hand — a gate
        // that blocks a release over a rule the product deliberately satisfies
        // another way is worse than no gate, because the only way past it is to
        // stop believing it.
        //
        // So: grow the painted box by any negative `::after` inset, and judge
        // THAT. The reachable box is never smaller than the painted one, so
        // nothing this used to catch escapes — a genuinely small control with
        // no hit slop still fails, which is how `+` and the send arrow (32x44
        // reachable, wide enough to see and not to hit) were found.
        let small = []
        if (touch && status < 400) {
          small = await page.evaluate(() => {
            const out = []
            const outward = (v) => { const n = parseFloat(v); return isNaN(n) || n > 0 ? 0 : -n }
            // A SEPARATOR IS NOT A TAP TARGET, so it is not measured. Four
            // resizers in hanzo.app are `<button role="separator">`, and a
            // thumb-sized square is the one shape a divider must not have —
            // the composer's grip is 14px tall at `top: -7` deliberately,
            // because a taller strip takes the taps meant for the field's
            // first line. This selector must stay identical to the floor in
            // the app's assets/globals.css: a gate that measures what the
            // stylesheet declines to size fails CI for a shape nobody wants.
            for (const el of document.querySelectorAll('button:not([role="separator"]),[role="button"],a[href]')) {
              const r = el.getBoundingClientRect()
              if (r.width < 1 || r.height < 1) continue
              if (el.closest('p')) continue
              const a = getComputedStyle(el, '::after')
              const w = r.width + outward(a.left) + outward(a.right)
              const h = r.height + outward(a.top) + outward(a.bottom)
              if (Math.min(w, h) >= 44) continue
              const seen = `${Math.round(r.width)}x${Math.round(r.height)}`
              const hit = `${Math.round(w)}x${Math.round(h)}`
              out.push(`${hit === seen ? hit : `${hit} (painted ${seen})`} ${((el.getAttribute('aria-label') || el.textContent || '').trim() || '(icon)').slice(0, 30)}`)
            }
            return out
          })
        }
        const thrown = errs.filter(e => e.startsWith('pageerror') || e.startsWith('nav'))
        const bad = status >= 400 || status === 0 || thrown.length > 0 || boundaryHits > 0 || !!overflow || small.length > 0
        if (bad) failed++
        console.log(`${bad ? 'FAIL' : 'ok  '} ${vp.width}px ${route} status=${status} thrown=${thrown.length} boundary=${boundaryHits}${overflow ? ` overflow=${overflow.scrollW}>${vp.width}` : ''}`)
        if (overflow) console.log('       widest past the edge:', overflow.culprit)
        if (small.length) console.log('       under the 44px touch floor:', small.slice(0, 6).join(' | '))
        for (const e of errs.slice(0, 5)) console.log('      ', e)
      }
      await ctx.close()
    }
    await browser.close()
    if (failed > 0) { console.error(`GATE: ${failed} route/viewport check(s) failed — sync refused`); process.exit(1) }
    console.log('GATE: all routes render clean — sync may proceed')
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "app.name" . }}-e2e-gate
  annotations:
    deploy.hanzo.ai/hook: PreSync
    deploy.hanzo.ai/hook-delete-policy: BeforeHookCreation
    cd.hanzo.ai/hook: PreSync
    cd.hanzo.ai/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "app.name" . }}-e2e-gate
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        {{- /* Native sidecar: lives for the pod, dies with the tester, and the
               Job completes on the tester's verdict alone. */}}
        - name: candidate
          image: {{ include "app.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          restartPolicy: Always
          env:
          {{- with .Values.env }}
            {{- range . }}
            - name: {{ .name }}
              {{- if hasKey . "value" }}
              value: {{ .value | quote }}
              {{- end }}
              {{- with .valueFrom }}
              valueFrom:
                {{- toYaml . | nindent 16 }}
              {{- end }}
            {{- end }}
          {{- end }}
            {{- with include "app.version" . }}
            - name: HANZO_VERSION
              value: {{ . | quote }}
            {{- end }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: {{ .Values.e2e.candidateMemory | default "1Gi" }}}
      containers:
        - name: tester
          image: mcr.microsoft.com/playwright:v{{ .Values.e2e.playwrightVersion }}-noble
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -e
              npm install --prefix /tmp/gate --no-save --no-audit --no-fund \
                --registry {{ .Values.e2e.npmRegistry | default "https://pkg.hanzo.ai" }} \
                playwright-core@{{ .Values.e2e.playwrightVersion }} \
                || npm install --prefix /tmp/gate --no-save --no-audit --no-fund \
                     --registry https://registry.npmjs.org playwright-core@{{ .Values.e2e.playwrightVersion }}
              cp /gate/smoke.mjs /tmp/gate/smoke.mjs
              # ESM resolution ignores NODE_PATH; the script must sit beside its node_modules.
              node /tmp/gate/smoke.mjs
          env:
            - name: GATE_TARGET
              value: "http://127.0.0.1:{{ .Values.e2e.port | default 3000 }}"
            - name: GATE_ROUTES
              value: {{ .Values.e2e.routes | toJson | quote }}
            - name: GATE_BOUNDARY_TEXT
              value: {{ .Values.e2e.boundaryText | default "Critical Error" | quote }}
          volumeMounts:
            - name: gate
              mountPath: /gate
          resources:
            requests: {cpu: 200m, memory: 512Mi}
            limits: {memory: 2Gi}
      volumes:
        - name: gate
          configMap:
            name: {{ include "app.name" . }}-e2e-gate
{{- end }}

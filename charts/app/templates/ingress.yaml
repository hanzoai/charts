{{/*
Ingress.

`ingress.hosts` takes either shape, and the shape is what decides how many objects
come out — derived, like the workload kind, so the two can never disagree:

  hosts:
    - www.hanzo.ai          a STRING: this host joins the ONE shared Ingress named
    - hanzo.ai              after the app, with the shared paths and annotations.

    - host: kms.hanzo.ai    a MAP: this host gets its OWN Ingress named
      paths: [...]          <app>-<host>, with its own backends, its own
      annotations: {...}     annotations and its own TLS secret.

Kubernetes forces that split; it is not a preference. Annotations are per OBJECT, so
a host that needs its own middleware chain, redirect or backend CANNOT share an
Ingress with another host. This is the whole of what the App CRD called
`role: ingress` + `domains` — a declaration with no container whose output is one
Ingress per host — and its absence is why the api/console/kms/published-sites edges
could not leave the CRD. There is no `role` key and no second template: no `image`
means no workload, and a map-shaped host means its own object.

The per-host NAME is the operator's rule kept exactly (see `app.host`), because an
Ingress name IS a cert-manager Certificate name: renaming one re-issues a
certificate for every host it touches, and doing that by list position is how one
namespace accumulated nine generations of certs for the same four hosts.
*/}}
{{- if .Values.ingress.enabled -}}
{{- $name := include "app.name" . -}}
{{- $svcPort := 0 -}}
{{- if .Values.ports -}}
{{- $svcPort = (first .Values.ports).servicePort | default (first .Values.ports).containerPort -}}
{{- end -}}
{{- $shared := list -}}
{{- $own := list -}}
{{- range .Values.ingress.hosts -}}
{{- if kindIs "string" . -}}{{- $shared = append $shared . -}}{{- else -}}{{- $own = append $own . -}}{{- end -}}
{{- end -}}
{{- if $shared }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
  annotations:
    kubernetes.io/ingress.class: {{ .Values.ingress.className }}
    {{- if and .Values.ingress.tls .Values.ingress.clusterIssuer }}
    cert-manager.io/cluster-issuer: {{ .Values.ingress.clusterIssuer }}
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    {{- range $host := $shared }}
    - host: {{ $host | quote }}
      http:
        paths:
          {{- if $.Values.ingress.paths }}
          {{- range $.Values.ingress.paths }}
          - path: {{ .path }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                name: {{ .service | default $name }}
                port:
                  number: {{ .port | default $svcPort }}
          {{- end }}
          {{- else }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $name }}
                port:
                  number: {{ $svcPort }}
          {{- end }}
    {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    - hosts:
        {{- toYaml $shared | nindent 8 }}
      secretName: {{ .Values.ingress.secretName | default (printf "%s-tls" $name) }}
  {{- end }}
{{- end }}
{{- range $own }}
{{- $ing := printf "%s-%s" $name (include "app.host" .host) }}
{{- $tls := hasKey . "tls" | ternary .tls $.Values.ingress.tls }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $ing }}
  labels:
    {{- include "app.labels" $ | nindent 4 }}
  annotations:
    kubernetes.io/ingress.class: {{ $.Values.ingress.className }}
    {{- $issuer := .clusterIssuer | default $.Values.ingress.clusterIssuer }}
    {{- if and $tls $issuer }}
    cert-manager.io/cluster-issuer: {{ $issuer }}
    {{- end }}
    {{- with $.Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- /* This host's own annotations merge LAST, so its edge behaviour lands on
           THIS host and wins over the shared default. */}}
    {{- with .annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ $.Values.ingress.className }}
  rules:
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range (.paths | default $.Values.ingress.paths | default (list (dict "path" "/"))) }}
          - path: {{ .path }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                name: {{ .service | default $name }}
                port:
                  number: {{ .port | default $svcPort }}
          {{- end }}
  {{- if $tls }}
  tls:
    - hosts:
        - {{ .host | quote }}
      secretName: {{ .secretName | default (printf "%s-tls" $ing) }}
  {{- end }}
{{- end }}
{{- end }}

{{- if .Values.migrate.enabled }}
{{- /* Apply this release's migrations BEFORE its pods roll.

       Nothing else in this deploy applies them: there is no migrate step in the
       build workflow, no CronJob, no initContainer. So a release carrying a
       migration used to roll pods against a schema that did not have it yet.
       With the boot gate armed (bin/migrate-check runs `migrate --check` and
       `schema_drift` under `set -e`), those pods do not serve a mismatched
       schema — they CrashLoop. Insights sat that way for days at 719 restarts,
       serving only from the previous ReplicaSet, because the fix needed a human
       to notice and run migrate by hand.

       A PreSync hook is the slot for this, for the same reason the e2e gate uses
       it: CD applies nothing if the hook fails, so a migration that cannot apply
       leaves the running version serving rather than rolling pods that will not
       boot. Ordering matters more than it looks — PreSync means the schema is in
       place before the first new pod starts, which is exactly the window that
       produced the CrashLoop.

       It runs the CANDIDATE image (`app.image`), so it applies the migrations
       that release actually contains — not the ones the running pods have.

       WHICH APPS CAN TURN THIS ON: the same constraint as the e2e gate. The Job
       inherits `.Values.env`/`.Values.envFrom` and nothing else, so an app
       qualifies only if its database connection comes from env alone. An app
       that reads a mounted config file will connect somewhere else, or nowhere.

       `migrate` is idempotent, so a re-sync that changes nothing applies nothing
       and the hook is a fast no-op. */}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "app.name" . }}-migrate
  labels:
    {{- include "app.labels" . | nindent 4 }}
  annotations:
    deploy.hanzo.ai/hook: PreSync
    deploy.hanzo.ai/hook-delete-policy: BeforeHookCreation
    cd.hanzo.ai/hook: PreSync
    cd.hanzo.ai/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: {{ .Values.migrate.backoffLimit | default 0 }}
  activeDeadlineSeconds: {{ .Values.migrate.timeoutSeconds | default 1800 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "app.name" . }}-migrate
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: {{ include "app.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            {{- toYaml .Values.migrate.command | nindent 12 }}
          env:
          {{- with .Values.env }}
            {{- range . }}
            - name: {{ .name }}
              {{- if hasKey . "value" }}
              value: {{ .value | quote }}
              {{- end }}
              {{- with .valueFrom }}
              valueFrom:
                {{- toYaml . | nindent 16 }}
              {{- end }}
            {{- end }}
          {{- end }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.migrate.resources | nindent 12 }}
{{- end }}

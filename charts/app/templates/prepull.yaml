{{- /*
PREPULL — THE IMAGE REACHES THE NODE BEFORE THE POD THAT NEEDS IT.

Under `strategy: Recreate` the old pod is deleted and only THEN is the new one
created, so the image pull happens with nothing serving. Measured on a 1.55 GB
image landing on a node that had never seen those bytes, the pull is ~78% of the
gap — several times teardown and application boot combined. The downtime of a
Recreate deploy is mostly a download.

The pull cannot be moved out of that window by the Deployment itself, because
Recreate is what makes the workload a single writer: one RWO volume, one audit
hash chain with an in-memory head, per-org SQLite that does not coordinate
across pods. Overlapping two pods to hide the pull is the one thing that must
not happen here. So the pull is moved out by a SECOND workload that carries
none of those constraints and touches none of that state.

This DaemonSet names the SAME image the workload does and sits in sync-wave -1.
cd.hanzo.ai applies waves in order and does not begin the next one while any
resource in the current one is Progressing (gitops-engine/pkg/sync/sync_context.go
maps HealthStatusProgressing to OperationRunning, and the loop re-filters to the
lowest PENDING wave). A DaemonSet is Progressing until UpdatedNumberScheduled
== DesiredNumberScheduled and its pods are Available
(gitops-engine/pkg/health/health_daemonset.go), and a pod is not Available until
its image has been pulled.

So wave -1 IS the pull, and it runs while the old pod is still serving. Wave 0
then finds the bytes already on the node — "Container image already present on
machine", Scheduled to Started in under a second.

When the image has not moved this costs nothing: the DaemonSet is already
Healthy, wave -1 passes in one reconcile, and the sync proceeds as before.

── THIS CANNOT BECOME A SECOND WRITER ────────────────────────────────────────

The container runs the app IMAGE, never the app ENTRYPOINT. It execs `sleep`.
It mounts no volumes, receives no env, binds no port and is given no
ServiceAccount, so there is no path by which it opens the data directory, the
audit chain or a tenant store.

Its labels are deliberately NOT `app.selectorLabels`. Those are what the Service
selects on, and a pod carrying them is an ENDPOINT — the Service would route
live traffic into a sleeping shell that answers nothing. The name label here
gets the `-prepull` suffix precisely so that cannot happen.

Running, rather than an init container that exits, is also what keeps the bytes:
kubelet's image GC treats the images of running pods as in use, so the layers
cannot be reclaimed in the window between the pull and the rollout.

── WHY THE COMMAND IS A VALUE, AND WHY THIS IS OPT-IN ────────────────────────

The container has to run something that exists in the image, and the chart
cannot know what that is. `sleep` is present in anything built on a distro base;
an image built FROM scratch or on distroless has neither it nor a shell, and a
prepull that cannot start is worse than no prepull at all — it is Progressing
forever, and wave -1 never opens, which wedges every deploy of that service.

That is a per-image fact, so the service states it. 35 of 117 values files
declare Recreate and every one of them pays the same pull-inside-the-outage
cost; each can take this by setting `prepull.enabled: true` once its base image
has been checked for the command below.

Ignored under RollingUpdate, where maxSurge already brings the new pod up — and
pulls its image — while the old one still serves. There the pull is outside the
outage window already, and a prepull would only be a second copy of a download
that is not costing anything.
*/}}
{{- if and .Values.prepull.enabled (eq .Values.strategy "Recreate") (include "app.hasWorkload" .) }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ printf "%s-prepull" (include "app.name" .) | trunc 63 | trimSuffix "-" }}
  labels:
    app.kubernetes.io/name: {{ printf "%s-prepull" (include "app.name" .) | trunc 63 | trimSuffix "-" }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/component: prepull
    {{- with .Values.partOf }}
    app.kubernetes.io/part-of: {{ . }}
    {{- end }}
    {{- with include "app.version" . }}
    app.kubernetes.io/version: {{ . | quote }}
    {{- end }}
  annotations:
    {{- /* Before the workload. Everything else in this chart is wave 0. */}}
    cd.hanzo.ai/sync-wave: "-1"
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ printf "%s-prepull" (include "app.name" .) | trunc 63 | trimSuffix "-" }}
  {{- /* Every node at once. These pods serve nothing, so there is no reason to
         roll them one at a time — and one at a time would serialise the pulls
         this exists to overlap. */}}
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 100%
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ printf "%s-prepull" (include "app.name" .) | trunc 63 | trimSuffix "-" }}
        app.kubernetes.io/component: prepull
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- /* The nodes the workload can land on ARE the nodes worth warming.
             Copied from the workload rather than configured separately, so the
             two cannot drift into warming a node the pod will never use. */}}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- /* Nothing to drain. */}}
      terminationGracePeriodSeconds: 0
      enableServiceLinks: false
      automountServiceAccountToken: false
      containers:
        - name: hold
          image: {{ include "app.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
          command:
            {{- toYaml .Values.prepull.command | nindent 12 }}
          {{- /* Small enough to fit on a node that is already tight — cloud's
                 pool sits at 92% of memory requests, and a prepull that cannot
                 be SCHEDULED holds wave -1 open exactly as long as one that
                 cannot start. */}}
          resources:
            requests:
              cpu: 1m
              memory: 4Mi
            limits:
              cpu: 50m
              memory: 32Mi
{{- end }}

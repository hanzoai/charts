# Hanzo Gateway - Multi-provider AI Inference Gateway
# Default values

replicaCount: 2

image:
  repository: ghcr.io/hanzoai/gateway
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 3001
  metricsPort: 3002

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
  hosts:
    - host: gateway.hanzo.ai
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: hanzo-gateway-tls
      hosts:
        - gateway.hanzo.ai

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 200m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70

nodeSelector: {}
tolerations: []
affinity: {}

# Gateway configuration
config:
  # Default provider
  defaultProvider: digitalocean  # digitalocean, openai, anthropic

  # Provider configurations
  providers:
    digitalocean:
      enabled: true
      apiKey: ""
      models:
        - qwen3-32b
        - llama-3.3-70b
    openai:
      enabled: true
      apiKey: ""
      models:
        - gpt-4o
        - gpt-4o-mini
    anthropic:
      enabled: true
      apiKey: ""
      models:
        - claude-sonnet-4-20250514
        - claude-3-5-haiku-20241022

  # Rate limiting
  rateLimit:
    enabled: true
    requestsPerMinute: 60
    tokensPerMinute: 100000

  # Cost controls
  costControl:
    enabled: true
    maxCostPerRequest: 1.00
    monthlyBudget: 1000.00

  # Device authentication
  deviceAuth:
    enabled: true
    headerName: "X-Device-ID"

  # Logging
  logging:
    level: "info"
    format: "json"

# Redis for rate limiting and caching
redis:
  enabled: true
  auth:
    enabled: true
    password: ""
  master:
    persistence:
      enabled: true
      size: 1Gi

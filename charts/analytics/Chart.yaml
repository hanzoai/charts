apiVersion: v2
name: hanzo-analytics
description: Hanzo Analytics - Multi-tenant analytics and event tracking
type: application
version: 0.1.0
appVersion: "1.0.0"
kubeVersion: ">=1.25.0"
home: https://hanzo.ai
icon: https://hanzo.ai/icon.png
sources:
  - https://github.com/hanzoai/analytics
maintainers:
  - name: Hanzo AI
    email: ops@hanzo.ai
    url: https://hanzo.ai
keywords:
  - hanzo
  - analytics
  - tracking
  - events
  - metrics
dependencies:
  - name: clickhouse
    version: ">=4.0.0"
    repository: https://charts.bitnami.com/bitnami
    condition: clickhouse.enabled
  - name: kafka
    version: ">=26.0.0"
    repository: https://charts.bitnami.com/bitnami
    condition: kafka.enabled

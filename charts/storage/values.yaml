# Hanzo Storage - S3-compatible Object Storage
# Default values

replicaCount: 1

image:
  repository: ghcr.io/hanzoai/storage
  pullPolicy: IfNotPresent
  tag: ""

service:
  type: ClusterIP
  port: 9000
  consolePort: 9001

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: storage.hanzo.ai
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: hanzo-storage-tls
      hosts:
        - storage.hanzo.ai

resources:
  limits:
    cpu: 500m
    memory: 1Gi
  requests:
    cpu: 100m
    memory: 256Mi

# Storage configuration
config:
  rootUser: hanzo
  rootPassword: ""  # Auto-generated

  # Buckets to create
  buckets:
    - name: uploads
      policy: download
    - name: assets
      policy: public
    - name: backups
      policy: none

minio:
  enabled: true
  mode: standalone  # standalone, distributed
  persistence:
    enabled: true
    size: 100Gi

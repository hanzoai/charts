apiVersion: v2
name: hanzo-cloud
description: Hanzo Cloud - Multi-tenant AI infrastructure and MCP management platform
type: application
version: 0.1.0
appVersion: "1.0.0"
kubeVersion: ">=1.25.0"
home: https://hanzo.ai
icon: https://hanzo.ai/icon.png
sources:
  - https://github.com/hanzoai/cloud
maintainers:
  - name: Hanzo AI
    email: ops@hanzo.ai
    url: https://hanzo.ai
keywords:
  - hanzo
  - cloud
  - ai
  - mcp
  - multi-tenant
  - infrastructure
dependencies:
  - name: postgresql
    version: ">=12.0.0"
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: redis
    version: ">=17.0.0"
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
  - name: nats
    version: ">=7.0.0"
    repository: https://nats-io.github.io/k8s/helm/charts
    condition: nats.enabled

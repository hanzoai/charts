# Hanzo Cloud - Multi-tenant AI Infrastructure
# Default values

replicaCount: 3

image:
  repository: ghcr.io/hanzoai/cloud
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podSecurityContext:
  fsGroup: 1000

securityContext:
  runAsNonRoot: true
  runAsUser: 1000

service:
  type: ClusterIP
  port: 8080
  grpcPort: 9090

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: cloud.hanzo.ai
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: hanzo-cloud-tls
      hosts:
        - cloud.hanzo.ai

resources:
  limits:
    cpu: 2000m
    memory: 4Gi
  requests:
    cpu: 500m
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70

nodeSelector: {}
tolerations: []
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - hanzo-cloud
          topologyKey: kubernetes.io/hostname

# Hanzo Cloud configuration
config:
  # Multi-tenancy
  tenancy:
    isolation: namespace  # namespace, network, cluster
    defaultQuota:
      cpu: "4"
      memory: "8Gi"
      storage: "100Gi"

  # MCP Server Management
  mcp:
    enabled: true
    maxServersPerTenant: 50
    defaultTimeout: 30s

  # AI Model Management
  models:
    enabled: true
    providers:
      - name: anthropic
        enabled: true
      - name: openai
        enabled: true
      - name: local
        enabled: true

  # Agent Orchestration
  agents:
    enabled: true
    maxConcurrent: 100
    executionTimeout: 300s

  # Resource Scheduling
  scheduler:
    enabled: true
    algorithm: binpack  # binpack, spread, random

  # Billing & Usage
  billing:
    enabled: true
    provider: stripe
    usageTracking: true

  # API Settings
  api:
    rateLimit:
      enabled: true
      requestsPerMinute: 1000
    cors:
      enabled: true
      origins:
        - "https://*.hanzo.ai"

# Database
postgresql:
  enabled: true
  auth:
    username: hanzo
    password: ""
    database: hanzo_cloud
  primary:
    persistence:
      enabled: true
      size: 50Gi

# Cache
redis:
  enabled: true
  auth:
    enabled: true
    password: ""
  master:
    persistence:
      enabled: true
      size: 5Gi

# Message Queue
nats:
  enabled: true
  cluster:
    enabled: true
    replicas: 3
  jetstream:
    enabled: true
    fileStore:
      pvc:
        size: 10Gi

# External services (if not using bundled)
externalDatabase:
  host: ""
  port: 5432
  username: ""
  password: ""
  database: ""

externalRedis:
  host: ""
  port: 6379
  password: ""

externalNats:
  url: ""

# Hanzo Commerce - Multi-tenant Commerce
# Default values

replicaCount: 2

image:
  repository: ghcr.io/hanzoai/commerce
  pullPolicy: IfNotPresent
  tag: ""

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: commerce.hanzo.ai
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: hanzo-commerce-tls
      hosts:
        - commerce.hanzo.ai

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Commerce-specific configuration
config:
  # Payment providers
  stripe:
    enabled: true
    secretKey: ""
    webhookSecret: ""

  # Multi-tenancy
  tenancy:
    isolation: schema  # schema, database, row

postgresql:
  enabled: true
  auth:
    username: hanzo
    database: hanzo_commerce

redis:
  enabled: true

apiVersion: v2
name: hanzo-commerce
description: Hanzo Commerce - Multi-tenant e-commerce and payments
type: application
version: 0.1.0
appVersion: "1.0.0"
kubeVersion: ">=1.25.0"
home: https://hanzo.ai
icon: https://hanzo.ai/icon.png
sources:
  - https://github.com/hanzoai/commerce
maintainers:
  - name: Hanzo AI
    email: ops@hanzo.ai
    url: https://hanzo.ai
keywords:
  - hanzo
  - commerce
  - payments
  - stripe
  - e-commerce
dependencies:
  - name: postgresql
    version: ">=12.0.0"
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: redis
    version: ">=17.0.0"
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled

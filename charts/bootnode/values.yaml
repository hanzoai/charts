# Hanzo Bootnode - Multi-brand Web3 Platform
# Override with values-hanzo.yaml or values-bootnode.yaml for brand-specific config

# Brand configuration
brand: hanzo  # hanzo or bootnode
domain: web3.hanzo.ai

# Service Account
serviceAccount:
  create: true
  name: ""
  annotations: {}

# Image pull secrets
imagePullSecrets: []

# API Service
api:
  enabled: true
  replicaCount: 3
  image:
    repository: ghcr.io/hanzoai/bootnode
    tag: api-latest
    pullPolicy: Always
  port: 8000
  service:
    type: ClusterIP
    port: 80
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2Gi
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 20
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  env: {}

# Web Frontend
web:
  enabled: true
  replicaCount: 2
  image:
    repository: ghcr.io/hanzoai/bootnode
    tag: web-latest
    pullPolicy: Always
  port: 3001
  service:
    type: ClusterIP
    port: 80
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  env:
    NODE_ENV: production
    NEXT_PUBLIC_BRAND: hanzo
    NEXT_PUBLIC_API_URL: https://api.web3.hanzo.ai
    NEXT_PUBLIC_WS_URL: wss://ws.web3.hanzo.ai
    NEXT_PUBLIC_IAM_URL: https://hanzo.id
    NEXT_PUBLIC_IAM_CLIENT_ID: hanzo-web3
    NEXT_PUBLIC_IAM_DOMAIN: hanzo.id
    NEXT_PUBLIC_AUTH_MODE: iam

# Ingress
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: 10m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
  hosts:
    web: web3.hanzo.ai
    api: api.web3.hanzo.ai
    ws: ws.web3.hanzo.ai
  tls:
    enabled: true
    secretName: bootnode-tls

# Secrets (create externally)
secrets:
  name: bootnode-secrets
  # Expected keys: database-url, redis-url, datastore-url, jwt-secret, api-key-salt

# Hanzo KMS
kms:
  enabled: true
  url: https://kms.hanzo.ai
  org: hanzo
  project: bootnode
  env: production
  secretName: hanzo-kms-secrets

# Hanzo IAM
iam:
  enabled: true
  url: https://hanzo.id
  org: HANZO

# Pod Security
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true

# Pod Disruption Budget
podDisruptionBudget:
  enabled: true
  minAvailable: 2

# Affinity (spread across nodes)
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              component: api
          topologyKey: kubernetes.io/hostname

# Metrics
metrics:
  enabled: true
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    prometheus.io/path: /metrics

# Chain configuration
chains:
  ethereum:
    enabled: true
    rpcUrl: ""
    wsUrl: ""
  polygon:
    enabled: true
  arbitrum:
    enabled: true
  base:
    enabled: true
  optimism:
    enabled: true
  lux:
    enabled: true

# Features
features:
  wallets:
    enabled: true
    hdPath: "m/44'/60'/0'/0"
  gas:
    enabled: true
    buffer: 1.2
  bundler:
    enabled: true
    entryPoint: "0x5FF137D4b0FDCD49DcA30c7CF57E578a026d2789"
  nfts:
    enabled: true
    ipfsGateway: https://ipfs.io/ipfs/

# Dependencies (use external by default)
postgresql:
  enabled: false
redis:
  enabled: false

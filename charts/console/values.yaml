# Hanzo Console - Admin UI
# Default values

replicaCount: 2

image:
  repository: ghcr.io/hanzoai/console
  pullPolicy: IfNotPresent
  tag: ""

service:
  type: ClusterIP
  port: 3000

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: console.hanzo.ai
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: hanzo-console-tls
      hosts:
        - console.hanzo.ai

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 64Mi

# Console-specific configuration
config:
  # API endpoints
  apiUrl: https://api.hanzo.ai
  iamUrl: https://hanzo.id
  analyticsUrl: https://analytics.hanzo.ai

  # Feature flags
  features:
    commerce: true
    analytics: true
    gitops: true

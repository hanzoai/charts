apiVersion: apps/v1
kind: Deployment
metadata:
  name: console
  namespace: hanzo
  labels:
    app: console
spec:
  replicas: 1
  selector:
    matchLabels:
      app: console
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: console
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: console
          image: ghcr.io/hanzoai/console:3.156.7
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3001
              protocol: TCP
          env:
            # Application
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3001"
            - name: NEXTAUTH_URL
              value: "https://console.hanzo.ai"

            # NextAuth secrets
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: console-secrets
                  key: NEXTAUTH_SECRET
            - name: SALT
              valueFrom:
                secretKeyRef:
                  name: console-secrets
                  key: SALT
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: console-secrets
                  key: ENCRYPTION_KEY

            # OAuth with hanzo.id
            - name: AUTH_CUSTOM_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: console-secrets
                  key: AUTH_CUSTOM_CLIENT_ID
            - name: AUTH_CUSTOM_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: console-secrets
                  key: AUTH_CUSTOM_CLIENT_SECRET
            - name: AUTH_CUSTOM_ISSUER
              value: "https://hanzo.id"
            - name: AUTH_CUSTOM_NAME
              value: "Hanzo"
            - name: AUTH_CUSTOM_SCOPE
              value: "openid email profile"
            - name: AUTH_CUSTOM_ALLOW_ACCOUNT_LINKING
              value: "true"
            - name: HANZO_INIT_ORG_IDS
              value: "hanzo,lux,zoo,pars"
            - name: HANZO_INIT_ORG_NAMES
              value: "Hanzo,Lux,Zoo,Pars"
            - name: HANZO_INIT_USER_EMAIL
              value: "z@hanzo.ai"

            # Database
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: console-secrets
                  key: DATABASE_URL

            # Redis
            - name: REDIS_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: console-secrets
                  key: REDIS_CONNECTION_STRING

            # ClickHouse
            - name: CLICKHOUSE_URL
              valueFrom:
                secretKeyRef:
                  name: console-secrets
                  key: CLICKHOUSE_URL
            - name: CLICKHOUSE_USER
              valueFrom:
                secretKeyRef:
                  name: console-secrets
                  key: CLICKHOUSE_USER
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: console-secrets
                  key: CLICKHOUSE_PASSWORD
            - name: CLICKHOUSE_MIGRATION_URL
              valueFrom:
                secretKeyRef:
                  name: console-secrets
                  key: CLICKHOUSE_MIGRATION_URL
            - name: CLICKHOUSE_DB
              valueFrom:
                secretKeyRef:
                  name: console-secrets
                  key: CLICKHOUSE_DB
            - name: CLICKHOUSE_CLUSTER_ENABLED
              valueFrom:
                secretKeyRef:
                  name: console-secrets
                  key: CLICKHOUSE_CLUSTER_ENABLED

            # S3/MinIO for event uploads (using internal minio)
            - name: HANZO_S3_EVENT_UPLOAD_BUCKET
              value: "hanzo-events"
            - name: HANZO_S3_EVENT_UPLOAD_ENDPOINT
              value: "http://minio:9000"
            - name: HANZO_S3_EVENT_UPLOAD_REGION
              value: "us-east-1"

            # Skip auto ClickHouse migration (baked-in .env has placeholders)
            - name: HANZO_AUTO_CLICKHOUSE_MIGRATION_DISABLED
              value: "true"

            # Telemetry
            - name: NEXT_TELEMETRY_DISABLED
              value: "1"

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 90
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 5
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: console
  namespace: hanzo
  labels:
    app: console
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    app: console
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: console-hpa
  namespace: hanzo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: console
  minReplicas: 1
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

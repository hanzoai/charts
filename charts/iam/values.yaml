# One IAM per org boundary. The store is embedded SQLite by default; point
# store.backend at sql or datastore to use hanzoai/sql over ZAP instead.

replicas: 1

image:
  repository: ghcr.io/hanzoai/iam
  # Empty tag follows Chart.appVersion. Set digest to pin exactly.
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent

pullSecrets: []

store:
  # sqlite | sql | datastore
  backend: sqlite
  # ZAP address of hanzoai/sql, for sql and datastore.
  sqlAddr: ""
  # Path of the SQLite file inside the volume.
  path: /data/iam.db

ports:
  http: 8080
  zap: 9653
  ops: 9090

# IAM_ISSUER, IAM_ISSUER_MAP and the rest. Environment-specific values live in
# the universe repo; the chart adds none of its own.
env: []

# Extra flags for iam serve.
args: []

storage:
  enabled: true
  existingClaim: ""
  size: 10Gi
  class: ""

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi

service:
  type: ClusterIP
  annotations: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}

# Hanzo IAM - Identity and Access Management
# Default values

replicaCount: 2

image:
  repository: ghcr.io/hanzoai/iam
  pullPolicy: IfNotPresent
  tag: ""  # Defaults to Chart appVersion

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podSecurityContext:
  fsGroup: 1000

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: hanzo.id
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: hanzo-iam-tls
      hosts:
        - hanzo.id

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}

# IAM-specific configuration
config:
  # Base URL for the IAM service
  baseUrl: https://hanzo.id

  # Session configuration
  session:
    secret: ""  # Auto-generated if empty
    ttl: 86400  # 24 hours

  # OAuth providers
  oauth:
    github:
      enabled: true
      clientId: ""
      clientSecret: ""
    google:
      enabled: true
      clientId: ""
      clientSecret: ""
    gitlab:
      enabled: false
      clientId: ""
      clientSecret: ""

  # Email configuration
  email:
    provider: resend  # resend, sendgrid, smtp
    from: noreply@hanzo.ai
    apiKey: ""

  # Rate limiting
  rateLimit:
    enabled: true
    windowMs: 900000  # 15 minutes
    max: 100

# Database configuration
postgresql:
  enabled: true
  auth:
    username: hanzo
    password: ""  # Auto-generated if empty
    database: hanzo_iam
  primary:
    persistence:
      enabled: true
      size: 10Gi

# Cache configuration
redis:
  enabled: true
  auth:
    enabled: true
    password: ""  # Auto-generated if empty
  master:
    persistence:
      enabled: true
      size: 1Gi

# External database (if postgresql.enabled is false)
externalDatabase:
  host: ""
  port: 5432
  username: ""
  password: ""
  database: ""
  sslMode: require

# External cache (if redis.enabled is false)
externalRedis:
  host: ""
  port: 6379
  password: ""

apiVersion: v2
name: hanzo-iam
description: Hanzo Identity and Access Management Service
type: application
version: 0.1.0
appVersion: "1.0.0"
kubeVersion: ">=1.25.0"
home: https://hanzo.ai
icon: https://hanzo.ai/icon.png
sources:
  - https://github.com/hanzoai/iam
maintainers:
  - name: Hanzo AI
    email: ops@hanzo.ai
    url: https://hanzo.ai
keywords:
  - hanzo
  - iam
  - identity
  - authentication
  - authorization
dependencies:
  - name: postgresql
    version: ">=12.0.0"
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: redis
    version: ">=17.0.0"
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled

apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hanzo-iam.fullname" . }}-secrets
  labels:
    {{- include "hanzo-iam.labels" . | nindent 4 }}
type: Opaque
data:
  session-secret: {{ .Values.config.session.secret | default (randAlphaNum 32) | b64enc | quote }}
  database-password: {{ .Values.postgresql.auth.password | default .Values.externalDatabase.password | default (randAlphaNum 16) | b64enc | quote }}
  redis-password: {{ .Values.redis.auth.password | default .Values.externalRedis.password | default (randAlphaNum 16) | b64enc | quote }}
  email-api-key: {{ .Values.config.email.apiKey | default "" | b64enc | quote }}
---
{{- if or .Values.config.oauth.github.enabled .Values.config.oauth.google.enabled .Values.config.oauth.gitlab.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hanzo-iam.fullname" . }}-oauth
  labels:
    {{- include "hanzo-iam.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.config.oauth.github.enabled }}
  github-client-secret: {{ .Values.config.oauth.github.clientSecret | b64enc | quote }}
  {{- end }}
  {{- if .Values.config.oauth.google.enabled }}
  google-client-secret: {{ .Values.config.oauth.google.clientSecret | b64enc | quote }}
  {{- end }}
  {{- if .Values.config.oauth.gitlab.enabled }}
  gitlab-client-secret: {{ .Values.config.oauth.gitlab.clientSecret | b64enc | quote }}
  {{- end }}
{{- end }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "iam.fullname" . }}
  labels: {{- include "iam.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  {{- if eq .Values.store.backend "sqlite" }}
  # One SQLite writer on one volume: the new pod starts after the old one stops.
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels: {{- include "iam.selector" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "iam.labels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations: {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "iam.serviceAccountName" . }}
      {{- with .Values.pullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: iam
          image: {{ include "iam.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - serve
            - --store={{ .Values.store.backend }}
            {{- if eq .Values.store.backend "sqlite" }}
            - --db={{ .Values.store.path }}
            {{- else }}
            - --sql-addr={{ required "store.sqlAddr is required for sql and datastore" .Values.store.sqlAddr }}
            {{- end }}
            - --http=http://:{{ .Values.ports.http }}
            - --zap=:{{ .Values.ports.zap }}
            - --ops=:{{ .Values.ports.ops }}
            {{- with .Values.args }}{{- toYaml . | nindent 12 }}{{- end }}
          {{- with .Values.env }}
          env: {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.ports.http }}
            - name: zap
              containerPort: {{ .Values.ports.zap }}
            - name: ops
              containerPort: {{ .Values.ports.ops }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: ops
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: ops
            periodSeconds: 15
          resources: {{- toYaml .Values.resources | nindent 12 }}
          {{- if and .Values.storage.enabled (eq .Values.store.backend "sqlite") }}
          volumeMounts:
            - name: data
              mountPath: {{ dir .Values.store.path }}
          {{- end }}
      {{- if and .Values.storage.enabled (eq .Values.store.backend "sqlite") }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.storage.existingClaim | default (printf "%s-data" (include "iam.fullname" .)) }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}

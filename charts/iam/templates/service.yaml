apiVersion: v1
kind: Service
metadata:
  name: {{ include "iam.fullname" . }}
  labels: {{- include "iam.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "iam.selector" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.ports.http }}
      targetPort: http
    - name: zap
      port: {{ .Values.ports.zap }}
      targetPort: zap

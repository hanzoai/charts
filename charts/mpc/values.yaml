# Hanzo MPC - Multi-Party Computation
# Default values

replicaCount: 3  # Minimum for threshold

image:
  repository: ghcr.io/hanzoai/mpc
  pullPolicy: Always
  tag: "latest"

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: mpc.hanzo.ai
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: hanzo-mpc-tls
      hosts:
        - mpc.hanzo.ai

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 200m
    memory: 256Mi

# MPC-specific configuration
config:
  # Threshold configuration (t of n)
  threshold: 2
  totalParties: 3

  # Key generation settings
  keyGen:
    curve: secp256k1

  # Signing settings
  signing:
    timeout: 30s

  # Event initiator public key (hex) - used to verify NATS event signatures
  eventInitiatorPubkey: "fc73ff7d77ed8f8ad69aa1b0b24ed25963996ccdca0c05906e9419dc56155f6c"

  # HTTP API server
  apiPort: 8080

  # Hanzo IAM endpoint for unified auth (validates bearer tokens)
  iamEndpoint: "https://hanzo.id"

env:
  - name: HANZO_MPC_IAM_ENDPOINT
    value: "https://hanzo.id"
  - name: HANZO_MPC_API_PORT
    value: "8080"
